<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
   <meta charset="UTF-8">
    <title>Persons</title>
</head>
<body>
<h1>Manage Persons</h1>
<a th:href="@{/persons/new}">Add New Person</a>
<table class="table">
    <thead class="table-danger">
    <tr>
        <th scope="col">First name</th>
        <th scope="col">Last name</th>
        <th scope="col">Email</th>
        <th scope="col">Password</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="person: ${personsList}">
        <tr>
            <td> -> [[ ${person.firstName} ]] <- </td>
            <td th:text="${person.lastName}"/>
            <td th:text="${person.email}"/>
            <td th:text="${person.password}"/>
            <td>
               <a th:href="@{'/persons/delete/' + ${person.id}}">Delete</a>
               <a th:href="@{'/persons/update/' + ${person.id}}">Update</a>
            </td>
        </tr>
    </th:block>
    </tbody>
</table>
</body>
</html>
